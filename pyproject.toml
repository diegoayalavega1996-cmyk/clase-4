[project]
name = "01-python-intro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.4.1",
    "ipykernel>=7.3.0",
    "lxml>=6.1.1",
    "matplotlib>=3.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.1",
    "opencv-contrib-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "pygame>=2.6.1",
    "pyodbc>=5.3.0",
    "pythonnet>=3.1.0",
    "pywin32>=312",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "statsmodels>=0.14.6",
    "timm>=1.0.30",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

